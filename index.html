async function readBin(){
  try{
    const r=await fetch(SUPA_URL+'/cp_tracker?id=eq.main',{headers:SUPA_HDR});
    const d=await r.json();
    if(d&&d[0]){
      S.st=d[0].st||{};

      S.nid=d[0].nid||1;
      S.photos=d[0].photos||{};

      S.headboards=d[0].headboards||{};
    }
  }catch(e){console.log('read error:',e);setSS('e');}
}
async function writeBin(){

function compressImage(file,maxW=800,q=0.55){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const cv=document.createElement('canvas');
        let w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.src=e.target.result;
    };
    rd.readAsDataURL(file);
  });
}

// ── Excel Export ──────────────────────────────────────────────────
function exportExcel(){
  const wb=XLSX.utils.book_new();

  // Sheet 1: Status overview
  const statusRows=[['Cluster','Lodge','Lodge Type','Item','Status']];
  Object.keys(PD).sort().forEach(cluster=>{
    Object.keys(PD[cluster]).sort((a,b)=>+a-+b).forEach(lodge=>{
      lodgeItems(cluster,lodge).forEach(item=>{
        const st=gS(cluster,lodge,item)||'Not started';
        statusRows.push([cluster,'Lodge '+lodge,PD[cluster][lodge].n,item,st]);
      });
    });
  });
  const ws1=XLSX.utils.aoa_to_sheet(statusRows);
  ws1['!cols']=[{wch:20},{wch:10},{wch:12},{wch:40},{wch:20}];
  // Colour header row
  const hdr=statusRows[0];
  hdr.forEach((_,ci)=>{
    const cell=XLSX.utils.encode_cell({r:0,c:ci});
    if(ws1[cell]){ws1[cell].s={fill:{fgColor:{rgb:'1F3864'}},font:{color:{rgb:'FFFFFF'},bold:true}};}
  });
  XLSX.utils.book_append_sheet(wb,ws1,'Status');

  // Sheet 2: Snag log
  const snagRows=[['Lodge','Cluster','Category / Item','Snag Description','Date','Status']];
  S.snags.forEach(s=>{
    snagRows.push(['Lodge '+s.l,s.c,s.i||'General',s.note,s.d,s.st]);
  });
  const ws2=XLSX.utils.aoa_to_sheet(snagRows);
  ws2['!cols']=[{wch:10},{wch:22},{wch:28},{wch:45},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb,ws2,'Snag Log');

  // Sheet 3: Summary by cluster
  const sumRows=[['Cluster','Total Items','Finished','In Progress','Not Started','Open Snags','% Complete']];
  Object.keys(PD).sort().forEach(cluster=>{
    let total=0,finished=0,inProg=0,notStart=0,openSnags=0;
    Object.keys(PD[cluster]).forEach(lodge=>{
      lodgeItems(cluster,lodge).forEach(item=>{
        total++;
        const st=gS(cluster,lodge,item)||'';
        if(st==='Finished')finished++;
        else if(st==='Installed'||st==='Installed - Snagged'||st==='Delivered')inProg++;
        else notStart++;
      });
      openSnags+=oS(cluster,lodge);
    });
    const pct=total?Math.round(finished/total*100):0;
    sumRows.push([cluster,total,finished,inProg,notStart,openSnags,pct+'%']);
  });
  const ws3=XLSX.utils.aoa_to_sheet(sumRows);
  ws3['!cols']=[{wch:22},{wch:12},{wch:12},{wch:14},{wch:14},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws3,'Summary');

  XLSX.writeFile(wb,'CP_Tracker_'+today()+'.xlsx');
  toast('Excel downloaded ✓');
}

function gS(c,l,i){return S.st[c+'|'+l+'|'+i]||'';}
function sS(c,l,i,v){S.st[c+'|'+l+'|'+i]=v;sched();}
function today(){return new Date().toISOString().split('T')[0];}
function prog(c,l){const its=lodgeItems(c,l),d=its.filter(i=>gS(c,l,i)==='Installed').length;return{d,t:its.length,p:its.length?Math.round(d/its.length*100):0};}
function oS(c,l){return S.snags.filter(s=>s.c===c&&s.l===l&&s.st!=='Fixed'&&s.st!=='Closed').length;}
function scl(s){return{'Left Factory':'lft',Delivered:'del','Installed — Snagged':'sn',Installed:'fin'}[s]||'';}
function snCl(s){return{Open:'op','In Progress':'ip','Awaiting Factory':'af'}[s]||'fx';}
function e(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pk(c,l,item){return c+'||'+l+'||'+item;}

function groupItems(its){
  const kitKeys=['Kitchen —','Splashback','MDF Head Filler — Kitchen','Kitchen Plinth','Appliance Installation'];
  let kitchen=[],beds={},other=[];
  its.forEach(item=>{
    if(kitKeys.some(k=>item.includes(k)))kitchen.push(item);
    else if(item.startsWith('Bed ')){
      const p=item.split(' ');
      if(p.length>1&&!isNaN(+p[1])){const bn=+p[1];if(!beds[bn])beds[bn]=[];beds[bn].push(item);}
      else other.push(item);
    } else other.push(item);
  });
  const cvs=other.indexOf('Corner Vanity Shelf');
  if(cvs>=0){
    const cvBed=Object.keys(beds).map(Number).sort().find(bn=>beds[bn].some(i=>i.includes('Corner Vanity')&&!i.includes('Shelf')));
    if(cvBed!==undefined){beds[cvBed].push('Corner Vanity Shelf');other.splice(cvs,1);}
  }
  ['Wardrobe Plinth','MDF Head Filler — Wardrobe'].forEach(key=>{
    const idx2=other.findIndex(i=>i.includes(key));
    if(idx2<0)return;
    const robeBeds=Object.keys(beds).map(Number).filter(bn=>beds[bn].some(i=>i.includes('Robe')));
    const target=robeBeds.length?Math.max(...robeBeds):(Object.keys(beds).length?Math.max(...Object.keys(beds).map(Number)):null);
    if(target!==null){beds[target].push(other[idx2]);other.splice(idx2,1);}
  });
  return{kitchen,beds,other};
}

function bind(){
  const $=id=>document.getElementById(id);
  const cls=Object.keys(PD).sort();
  if($('n-cl'))$('n-cl').onclick=()=>{V='cl';render();};
  if($('n-log'))$('n-log').onclick=()=>{V='log';FL='all';render();};
  if($('n-rep'))$('n-rep').onclick=()=>{V='rep';render();};
  if($('n-add'))$('n-add').onclick=()=>{V='add';PF=null;render();};
  if($('n-mis'))$('n-mis').onclick=()=>{V='mis';render();};
  if($('n-hb'))$('n-hb').onclick=()=>{V='hb';render();};
  if($('back-cl'))$('back-cl').onclick=()=>{V='cl';render();};
  if($('back-lo'))$('back-lo').onclick=()=>{V='lo';render();};
  if($('add-cl'))$('add-cl').onclick=()=>{PF={c:C,l:'',i:''};V='add';render();};
  if($('add-lo'))$('add-lo').onclick=()=>{PF={c:C,l:L,i:''};V='add';render();};
  if($('rfbtn'))$('rfbtn').onclick=async()=>{
    // Save any pending changes first, then read latest
    clearTimeout(saveTimer);
    $('rfbtn').textContent='Syncing…';
    await writeBin();
    await readBin();
    render();
    toast('Synced ✓');
  };

  // Cluster list buttons
  Object.keys(PD).sort().forEach((cl,ci)=>{
    Object.keys(PD[cl]).sort((a,b)=>+a-+b).forEach((l,li)=>{
      const b=$('lo-'+ci+'-'+li);
      if(b)b.onclick=()=>{C=cl;L=l;V='it';render();};
    });
  });

  // Lodge list buttons
  if(V==='lo')Object.keys(PD[C]).sort((a,b)=>+a-+b).forEach((l,i)=>{const b=$('lo-'+i);if(b)b.onclick=()=>{L=l;V='it';render();};});

  // Item status buttons and photos
  if(V==='it'){
    lodgeItems(C,L).forEach((item,i)=>{
      // Use index in full lodgeItems array for button IDs
      const gi=lodgeItems(C,L).indexOf(item);
      SS.forEach(sv=>{
        const b=$('sb-'+gi+'-'+sv.replace(/[\s—]+/g,'_'));
        if(b)b.onclick=()=>{const cur=gS(C,L,item);sS(C,L,item,cur===sv?'':sv);render();};
      });
      const sl=$('sl-'+gi);if(sl)sl.onclick=()=>{PF={c:C,l:L,i:item};V='add';render();};
      const ipu=$('ipu-'+gi);
      if(ipu)ipu.onchange=async function(){
        if(!this.files.length)return;
        toast('Saving photo…');
        const key=pk(C,L,item);
        if(!S.photos[key])S.photos[key]=[];
        for(const f of this.files){S.photos[key].push(await compressImage(f));}
        sched();render();toast('Photo saved ✓');
      };
      const iph=S.photos[pk(C,L,item)]||[];
      iph.forEach((_,pi)=>{const img=$('ip-'+gi+'-'+pi);if(img)img.onclick=()=>openLB(img.src);});
    });
  }

  // Section collapse toggles
  document.querySelectorAll('[data-sck]').forEach(hdr=>{
    hdr.onclick=()=>{
      const ck=hdr.dataset.sck;
      collapsed[ck]=!collapsed[ck];
      render();
    };
  });

  // Snag log filter chips
  ['all','Open','In Progress','Awaiting Factory','Fixed','Closed'].forEach(f=>{
    const b=$('f-'+f.replace(/\s+/g,'_'));if(b)b.onclick=()=>{FL=f;render();};
  });

  // Snag actions
  S.snags.forEach(s=>{
    const sel=$('ss-'+s.id);if(sel)sel.onchange=function(){s.st=this.value;sched();render();};
    const db=$('sd-'+s.id);if(db)db.onclick=()=>{if(!confirm('Delete this snag?'))return;S.snags=S.snags.filter(x=>x.id!==s.id);sched();render();};
    const photos=s.photos||[];
    photos.forEach((_,pi)=>{const img=$('sp-'+s.id+'-'+pi);if(img)img.onclick=()=>openLB(img.src);});
  });

  // Snag add form
  const faC=$('fa-c');if(faC)faC.onchange=function(){PF={c:this.value,l:'',i:''};render();};
  const faL=$('fa-l');if(faL)faL.onchange=function(){PF={c:$('fa-c').value,l:this.value,i:''};render();};
  const faPhoto=$('fa-photo');
  if(faPhoto)faPhoto.onchange=async function(){
    if(!this.files.length)return;
    toast('Compressing…');
    for(const f of this.files){pendingPhotos.push(await compressImage(f));}
    renderPhotoPreview();toast('Photo ready ✓');
  };
  const lb=$('log-btn');
  if(lb)lb.onclick=()=>{
    const c=$('fa-c').value,l=$('fa-l').value,i=$('fa-i').value;
    const n=$('fa-n').value.trim(),d=$('fa-d').value||today(),st=$('fa-s').value;
    const err=$('fa-err');
    if(!c||!l||!n){err.style.display='block';err.textContent='Please fill in Cluster, Lodge and Description.';return;}
    err.style.display='none';
    S.snags.push({id:S.nid++,c,l,i,note:n,d,st,photos:[...pendingPhotos]});
    if(i){const cs=gS(c,l,i);if(!cs||cs==='Installed')sS(c,l,i,'Installed — Snagged');}
    pendingPhotos=[];sched();toast('Snag logged ✓');$('fa-n').value='';PF={c,l,i:''};
  };

  // Report buttons
  if($('print-btn'))$('print-btn').onclick=()=>window.print();
  if($('excel-btn'))$('excel-btn').onclick=()=>{
    if(typeof XLSX==='undefined'){toast('Excel not ready — try again');return;}
    const cls=window._repClusters||Object.keys(PD).sort();
    const wb=XLSX.utils.book_new();
    // Sheet per cluster
    cls.forEach(cl=>{
      const rows=[['Lodge','Type','Item','Status']];
      Object.keys(PD[cl]||{}).sort((a,b)=>+a-+b).forEach(lodge=>{
        lodgeItems(cl,lodge).forEach(item=>{
          rows.push(['Lodge '+lodge,PD[cl][lodge].n,item,gS(cl,lodge,item)||'Not started']);
        });
      });
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:10},{wch:8},{wch:40},{wch:18}];
      XLSX.utils.book_append_sheet(wb,ws,cl.replace('Cluster ','Cl ').substring(0,31));
    });
    // Summary sheet
    const sum=[['Cluster','Lodges','Total Items','Signed Off','% Complete','Open Snags']];
    cls.forEach(cl=>{
      let ti=0,td=0;
      const ls=Object.keys(PD[cl]||{});
      ls.forEach(l=>{lodgeItems(cl,l).forEach(i=>{ti++;if(gS(cl,l,i)==='Installed')td++;});});
      const os=S.snags.filter(s=>s.c===cl&&['Open','In Progress','Awaiting Factory'].includes(s.st)).length;
      sum.push([cl,ls.length,ti,td,ti?Math.round(td/ti*100)+'%':'0%',os]);
    });
    const ws2=XLSX.utils.aoa_to_sheet(sum);
    ws2['!cols']=[{wch:25},{wch:8},{wch:12},{wch:12},{wch:12},{wch:12}];
    XLSX.utils.book_append_sheet(wb,ws2,'Summary');
    XLSX.writeFile(wb,'CP_Report_'+today()+'.xlsx');
    toast('Excel downloaded ✓');
  };
  if($('excel-btn'))$('excel-btn').onclick=()=>exportExcel();
  if($('copy-btn'))$('copy-btn').onclick=()=>{
    const op=S.snags.filter(s=>['Open','In Progress','Awaiting Factory'].includes(s.st));
    if(!op.length){toast('No open snags');return;}
    const txt='CP Tracker Report - '+today()+'\\n\\n'+op.map(s=>'Lodge '+s.l+' ('+s.c+')'+(s.i?' | '+s.i:'')+'\\n'+s.note+'\\n'+s.d+' | '+s.st).join('\\n\\n');
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copied ✓'));
  };

  // Report cluster selector
  cls.forEach(cl=>{
    const btn=$('rclbtn-'+cl.replace(/\s+/g,'_'));
    if(btn)btn.onclick=()=>{
      if(!window._repClusters)window._repClusters=[...cls];
      const idx=window._repClusters.indexOf(cl);
      if(idx>=0)window._repClusters.splice(idx,1);
      else window._repClusters.push(cl);
      render();
    };
  });
  const raBtn=$('rep-all-btn');if(raBtn)raBtn.onclick=()=>{window._repClusters=[...cls];render();};
  const rnBtn=$('rep-none-btn');if(rnBtn)rnBtn.onclick=()=>{window._repClusters=[];render();};

  // Misplaced items
  if($('mis-log-btn'))$('mis-log-btn').onclick=()=>{
    const item=$('mis-type').value;
    const curLodge=$('mis-cur').value.trim();
    if(!item||!curLodge){toast('Select item type and enter current lodge');return;}
    S.misplaced.push({id:S.nid++,item,desc:$('mis-desc').value.trim(),curLodge,destLodge:$('mis-dest').value.trim(),date:today()});
    sched();toast('Logged ✓');render();
  };
  S.misplaced.forEach(mi=>{const db=$('mis-del-'+mi.id);if(db)db.onclick=()=>{S.misplaced=S.misplaced.filter(x=>x.id!==mi.id);sched();render();};});

    // Headboard binds
  if($('hb-log-btn'))$('hb-log-btn').onclick=()=>{
    const lodge=$('hb-lodge').value.trim();
    if(!lodge){toast('Enter lodge number');return;}
    if(!S.headboards.spares)S.headboards.spares=[];
    S.headboards.spares.push({id:S.nid++,lodge,boardType:$('hb-type').value,note:$('hb-note').value.trim(),date:today()});
    sched();toast('Logged ✓');render();
  };
  (S.headboards.spares||[]).forEach(sp=>{const db=$('hbs-del-'+sp.id);if(db)db.onclick=()=>{S.headboards.spares=S.headboards.spares.filter(x=>x.id!==sp.id);sched();render();};});
  (S.headboards.missing||[]).forEach(mi=>{const db=$('hbm-del-'+mi.id);if(db)db.onclick=()=>{S.headboards.missing=S.headboards.missing.filter(x=>x.id!==mi.id);sched();render();};});

      // Lightbox
  document.getElementById('lb-close').onclick=()=>document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox').onclick=function(e){if(e.target===this)this.classList.remove('open');};
}

// Show UI immediately, then load Supabase data
render();
readBin().then(()=>render());
</script>
</body>
</html>
